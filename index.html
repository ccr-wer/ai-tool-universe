  <title>拾光 · AI 工具宇宙</title>
  <style>

    .topbar{position:absolute;inset:0 4% auto;height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{display:flex;align-items:center;gap:11px;letter-spacing:3px;font-weight:600}.brand-mark{width:32px;height:32px;border:1px solid #a9e9dc66;border-radius:10px;display:grid;place-items:center;color:var(--mint)}.brand-mark svg{width:20px;height:20px}.brand small{margin-left:10px;color:#71809b;font-size:10px;letter-spacing:2px;font-weight:400}.top-meta{color:#70809a;font:10px ui-monospace,monospace;letter-spacing:1px}

    /* 文字背后的一层极弱暗场：星系核心的泛光会顶到标题上，
       没有它白色核心会让标题"糊进光里"。径向渐变两端都收到 0，
       所以看不到任何矩形边界，只是把局部背景压暗约 40%。 */
    .hero{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(880px,90vw);text-align:center;isolation:isolate}
    /* 文字保护：用户点名的 0 2px 10px rgba(0,0,0,.9)，再叠一层 1px/3px 的实底阴影护住笔画边缘。

    .hero::before{content:'';position:absolute;left:-14%;right:-14%;top:-26%;bottom:-30%;z-index:-1;pointer-events:none;
      background:radial-gradient(ellipse 54% 50% at 50% 50%,rgba(0,0,0,.58),rgba(0,0,0,.36) 44%,rgba(0,0,0,.14) 64%,rgba(0,0,0,0) 80%)}

    h1 em{color:var(--mint);font-style:normal}
    .hero p{margin:22px auto 0;max-width:430px;color:#aab8cc;font-size:13px;line-height:1.8;text-shadow:0 2px 10px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.95)}
    .hint{margin-top:28px;color:#8e9db3;font-size:11px;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.95)}
    .category-dock{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:min(1140px,92vw);display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.category-btn{min-height:58px;padding:10px 8px;border:1px solid #ffffff1f;border-radius:12px;background:rgba(0,0,0,.62);backdrop-filter:blur(18px) saturate(115%);-webkit-backdrop-filter:blur(18px) saturate(115%);color:#c8d3e4;transition:transform .2s,border-color .2s,background .2s,color .2s}.category-btn:hover{transform:translateY(-5px);border-color:var(--accent);background:rgba(10,14,24,.78);color:#fff}.category-btn .dot{display:block;width:5px;height:5px;margin:0 auto 8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}.category-btn strong{display:block;font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.category-btn small{display:block;margin-top:5px;color:#8d9cb2;font:10px ui-monospace,monospace}
    /* ===== 分类页：非对称双栏 3 : 7 ===== */

    .tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}

    .score{flex:0 0 auto;min-width:50px;text-align:right;color:#7fe3c8;font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:.5px;text-shadow:0 0 14px rgba(127,227,200,.35)}

    @media(max-width:850px){.topbar{inset-inline:6%;height:66px}.brand small,.top-meta{display:none}.hero{top:34%}.hero p{font-size:12px}.category-dock{grid-template-columns:repeat(3,1fr);bottom:18px;gap:6px}.category-btn{min-height:53px;padding:8px 5px}.category-btn strong{font-size:10px}.category-btn small{font-size:9px}
      .list-grid{grid-template-columns:1fr}.bh-view{display:none}.list-panel{padding:92px 18px 0;background:rgba(8,12,17,.88);border-right:0}.list-panel::after{display:none}#panel-title{font-size:clamp(30px,8.5vw,44px)}.panel-kicker{margin-top:26px}.tool-item{padding:16px 2px 14px}.tool-name{font-size:16px}.footer-note{display:none}}

  <!-- Three.js 走本站 vendor（r180，与 CDN 版本一致）。
       CDN 实测要 4-6 秒，本地是最快也最稳的取法。
       若要改回公共 CDN，把下面这行换成：
       {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
       注意部署时必须一并发布 vendor/ （.vercelignore 未排除它）。
       第十九轮起页面只用 "three" 本体；"three/addons/" 映射保留但无任何 import 引用
       （浏览器不会下载 examples/jsm，实测 0 请求）。留着是为了将来想复用某个 addon 时不用改这里。 -->
  <script type="importmap">{"imports":{
    "three":"./vendor/three/build/three.module.js",
    "three/addons/":"./vendor/three/examples/jsm/"
  }}</script>

<body>
  <div id="scene" aria-hidden="true"></div>
  <main class="ui app" id="app">
    <header class="topbar"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z" stroke="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></span><span>拾光</span><small>AI TOOL UNIVERSE</small></div><div class="top-meta" id="top-meta">09 GALAXIES · 000 TOOLS</div></header>
    <section class="view home" id="home-view"><div class="hero"><p class="eyebrow">A UNIVERSE OF POSSIBILITIES</p><h1>让好工具，<em>离你更近。</em></h1><p>从一个中心星系出发，进入九个领域，找到正在改变工作方式的工具。</p><div class="hint">选择下方分类，进入对应星系</div></div><nav class="category-dock" id="category-dock" aria-label="工具分类"></nav><div class="footer-note">CENTRAL GALAXY / ALL TOOLS</div></section>
    <section class="view list" id="list-view" inert>
      <div class="list-grid">
        <aside class="list-panel" id="panel">
          <div class="panel-head">
            <button class="back" id="back" type="button">← 返回星系</button>
            <p class="panel-kicker" id="panel-kicker"></p>
            <h2 id="panel-title"></h2>
            <p class="panel-subtitle" id="panel-subtitle"></p>
          </div>
          <div class="tool-list" id="tool-list"></div>
          <div class="list-fade" aria-hidden="true"></div>
        </aside>
        <div class="bh-view" id="bh-view" aria-hidden="true"><span class="bh-hint">DRAG TO ROTATE</span></div>
      </div>
    </section>
  </main>
  <div class="status" id="status"><div class="status-card"><h2 id="status-title">正在点亮星空</h2><p id="status-message">从 data/tools.json 读取工具数据…</p><button id="continue-demo" hidden type="button">继续查看演示数据</button><button id="reload" hidden type="button">重新加载</button></div></div>
  <script>
    // Keep a useful status visible if the CDN module itself cannot be downloaded.
    window.__spaceModuleTimer=setTimeout(()=>{const status=document.querySelector('#status');if(status&&!status.hidden){document.querySelector('#status-title').textContent='星空模块载入失败';document.querySelector('#status-message').textContent='请检查 Three.js CDN 网络连接后重新加载。';document.querySelector('#reload').hidden=false;}},15000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    // 第十九轮：行星发动机（第十七轮的 UnrealBloomPass + Line2 方案）已全线回滚，
    // 页面只依赖 three 本体，不再从 examples/jsm 里 import 任何 addon。
    // vendor 里的 addons 文件保留（不加载即零成本），恢复时再引回即可。
    (()=>{
      // 自定义 shader 直接输出 sRGB 数值，关闭色彩管理避免颜色被二次转换压暗
      THREE.ColorManagement.enabled=false;
      const CATEGORIES=[['对话与助手','#9be7d6'],['图像生成与处理','#b9a6fa'],['视频与音频','#f0a8c8'],['编程与开发','#82baf5'],['写作与文本处理','#f1aa91'],['搜索与研究','#e5c87e'],['效率与办公','#80d1cc'],['模型与基础设施','#afb5f7'],['开发者作品','#c8d996']];
      const DEMO_TOOLS=[
        {id:'demo-chat',name:'Demo Chat',url:'https://example.com/demo-chat',category:'对话与助手',tags:['示例'],summary:'用于验证页面加载的演示工具',score:88},
        {id:'demo-canvas',name:'Demo Canvas',url:'https://example.com/demo-canvas',category:'图像生成与处理',tags:['示例'],summary:'用于验证分类列表的演示工具',score:76},
        {id:'demo-code',name:'Demo Code',url:'https://example.com/demo-code',category:'编程与开发',tags:['示例'],summary:'用于验证工具条目的演示工具',score:68}
      ];
      const $=s=>document.querySelector(s),app=$('#app'),dock=$('#category-dock'),list=$('#tool-list'),status=$('#status');
      let tools=[],groups=new Map(),current=null,scene,camera,renderer,points,geometry,positions,homePositions,colors,homeColors,categoryPositions,categoryColors,sizes,alphas,sectors,layers,pars,spikes,camDist=17.5,camDistTween=null,morphTween=null,last=0,running=true,spinning=0,wobbleT=0,parX=0,parY=0,tgtX=0,tgtY=0,hoverTarget=0,hoverS=0,hoverAngle=0,lastPointer=0,rafPending=false,fitPull=1,zoom=1,zoomTarget=1,zoomMin=1,zoomMax=1,gTilt=0,gSway=0,gSpin=0,
          dustPoints,dustGeometry;
      // 分类页右侧的独立视口：黑洞 + 引力透镜。只在分类页激活时渲染。
      let bhRenderer,bhScene,bhCamera,bhMat,bhHost,bhQuad,bhPending=false,bhLast=0,bhTime=0,bhFrames=0,
          bhDown=false,bhPX=0,bhPY=0,bhRatio=1,bhScale=.82,bhMissed=0,bhSampleN=0,bhClean=0,bhWarm=0,
          // 鼠标引力：位置用 vUv 空间（y 自下而上），强度 0..1 由指针进出渐变
          bhMouseU=.5,bhMouseV=.5,bhMouseK=0,bhMouseKT=0,
          // 相机轨道：az 绕黑洞公转，el 仰角。这是"真实三维"的唯一状态源。
          bhAz=.30,bhAzT=.30,bhEl=.085,bhElT=.085,bhHoverX=0,bhHoverY=0,bhHoverK=0;
      // 相机俯角 + 盘面倾角 共同决定星系的椭圆压缩比，两者都影响"看向盘面的角度"
      // 俯角从 21° 提到 27°：盘面投影的短轴/长轴从 0.394 压到 0.296，
      // 椭圆透视明显得多 —— 这正是"像真实天体"而不是"正对着看的光圈"的关键。
      const CAM_ELEV=THREE.MathUtils.degToRad(30),DISC_TILT=.8,HOME_DIST=17.5,LIST_DIST=26;
      const CAM_DIR=new THREE.Vector3(0,Math.sin(CAM_ELEV),Math.cos(CAM_ELEV));
      const SQUASH=Math.cos(CAM_ELEV+DISC_TILT);
      // 差速自转的**基准相位**速率（rad/s）。着色器里还要再乘 r^-0.70，
      // 所以这是"外盘"的角速度：外盘 r≈5.4 → om≈0.31，
      // 盘沿约 0.008*0.31*356px ≈ 0.9 px/s；内圈 r≈0.3 → om≈2.3，快 7 倍多。
      const SPIN_BASE=.0080,SPIN_HOVER=.0200;
      // 进动（陀螺摇摆）周期原本只有 27 秒，是画面里最明显的运动；一起放慢到约 108 秒
      const WOBBLE_SLOW=.058;
      // 缩放：camera.position.z 严格限制在 [10,40]。相机带 21° 俯角，
      // 所以轨道半径 = z / cos(21°)，由 z 区间直接反推，两者严格对应。
      const Z_MIN=10,Z_MAX=40,MIN_DIST=Z_MIN/Math.cos(CAM_ELEV),MAX_DIST=Z_MAX/Math.cos(CAM_ELEV);
      const ZOOM_DAMP=3;   // lerp 系数 3*dt，60fps 下正好是需求里的 0.05/帧
      const ZOOM_STEP=.0011;
      // 粒子分四组：密集微星 / 带十字星芒的主星 / 星系本体 / 暗尘埃
      // 星系本体再拆成"核球"与"旋臂星尘"两段，用同一套着色器、同一个 BufferGeometry，
      // 靠 attribute 区分 —— 这样加了几千颗粒子也不增加 draw call。
      const TINY_COUNT=7000,BIG_COUNT=50;
      // 核球从 3400 砍到 900：用户要求"削减中心密度"。
      // 亮度不再靠堆数量，而是靠 80 颗炽核 + 后处理泛光。
      const CORE_HOT=80;        // 炽核：极亮、稍大，是泛光的燃料
      const CORE_INNER=300;     // 内核：细碎颗粒，只补质感

          float bInv=sqrt(max(du*du+u*u-RS*u*u*u,1e-9));
          float bImp=1.0/bInv;
          // 这条光线最终会被吞掉的判据（解析解）。
          // 注意不能据此直接 return 黑色：吸积盘的近侧就在视界**前面**，
          // 必须先沿光线走完、把挡在洞前的盘面积累下来，否则近侧盘会被一起吞掉，
          // 形成"黑洞吃掉自己前襟"的错误画面。
          // 它只用来决定"步数用尽时该怎么收尾"。
          float willFall=1.0-step(2.5981,bImp);
          // b 越大轨迹越接近直线，可以把步长放粗（0 .. 0.11 rad）
          float dphiBoost=0.11*smoothstep(4.0,13.0,bImp);

          vec3 prevPos=ro;
          float yMinAbs=1e9;   // 全光线离赤道面最近的距离（光子环的平面窗口用）
          vec3 col=vec3(0.0);
          int passN=0;                 // 这条光线已经穿过盘面几次
          float trans=1.0;
          vec3 dirOut=rd;
          float escaped=0.0;

          for(int i=0;i<MAX_STEPS;i++){
            float rr=1.0/max(u,1e-5);
            // 近洞用细步，远处用粗步（远处偏折小，粗步不损精度）
            // 步长按"离临界有多近"分配：b≈b_crit 的那一圈光线要绕大半圈才能形成
            // 次级像，必须细步；其余光线偏折很小，粗步无损。
            // 这样总步数不必拉满，也能把那圈细密光环算出来。
            float crit=1.0-smoothstep(2.65,4.6,bImp);
            float near2=mix(0.0195,0.0072,crit);
            float dphi=mix(near2,0.058+dphiBoost,smoothstep(1.4,16.0,rr));
            float a1=1.5*RS*u*u-u;
            float un=u+du*dphi+0.5*a1*dphi*dphi;
            float a2=1.5*un*un*RS-un;
            float dun=du+0.5*(a1+a2)*dphi;
            float phin=phi+dphi;
            vec3 pos=(1.0/max(un,1e-5))*(cos(phin)*er+sin(phin)*et);

            // ---- 与赤道盘求交（3D 交点，不是屏幕上的斜线）----
            // 只做严格穿越：掠射时一条光线会有几十个"擦过盘面"的步长，
            // 每步都算一次盘面辐射（两次噪声采样）会把帧率直接拖垮（实测 23.8ms）。
            // 厚度改由两处提供：①DISK_H 本身 ②循环结束后的一次"最近点辉光"。
            {
              if(prevPos.y*pos.y<0.0){
              float kHit=prevPos.y/(prevPos.y-pos.y);
              vec3 hit=mix(prevPos,pos,kHit);
              float rho=length(hit.xz);
              // 门槛放宽一圈，真正的边缘由 dens 里的平滑径向窗收，
              // 这样盘缘不会因为硬 cut 出现一像素台阶。
              if(rho>R_IN*0.72&&rho<R_OUT*1.26){
                float ang=atan(hit.z,hit.x);
                vec3 rad=vec3(hit.x,0.0,hit.z)/max(rho,1e-4);
                vec3 vh=normalize(cross(vec3(0.0,1.0,0.0),rad));     // 轨道速度方向
                float beta=min(0.72,sqrt(0.5*RS/max(rho,1.15)));       // v = sqrt(GM/r)
                vec3 nobs=normalize(ro-hit);                           // 指向观察者
                float D=1.0/(sqrt(1.0-beta*beta)*(1.0-beta*dot(vh,nobs)));
                float dens;
                vec3 dc=diskEmission(rho,ang,D,dens);
                // 弦长：掠射（|vy| 小）时极长 → 亮；正射时短 → 淡。
                // 上一版是 min(2H/max(|vy|,0.010),9.0)：两个硬折点叠在一起。
                // |vy| 跨过 0.010 的那一列像素，弦长会在一个像素内跳两个
                // 数量级；tau 直接顶到 2.1 饱和，色块边界就呈锯齿状。
                // 这就是左侧那坨"灰白马赛克"的真正来源。
                // 换成软分母（二次平滑），曲线处处连续，锯齿消失。
                vec3 dirSeg=normalize(pos-prevPos);
                float ay=abs(dirSeg.y);
                float soft=sqrt(ay*ay+0.00090);        // ≈0.030 的软下限
                float chord=2.0*DISK_H/soft;
                float tau=clamp(dens*chord*0.26,0.0,2.1);
                float alpha=1.0-exp(-tau);
                // 高阶像（第 2 次及以后的穿越）只留 10%：
                // 它们在屏幕上是绕黑洞一圈才落回来的像，采样步长在这个尺度
                // 上根本不够细 —— 交点的 rho 会在相邻像素间跳 0.3~1.5，
                // 叠上集束后就是一块硬边的死白色板（用户看到的"灰白马赛克"）。
                // n≥1 的像本来就有专门的解析环项在画（连续、无台阶），
                // 这里再按全额累加就是重复计数。压到 10% 只用来补一点通透感。
                passN++;
                float passW=(passN<2)?1.0:0.10;
                col+=dc*alpha*trans*passW;
                trans*=exp(-tau*passW);
              }
              }
            }

            if(abs(pos.y)<yMinAbs)yMinAbs=abs(pos.y);
            vec3 seg=pos-prevPos;
            prevPos=pos;u=un;du=dun;phi=phin;

            if(u*RS>0.995)break;                       // 落入视界
            if(u<1.0/ESCAPE_R&&du<0.0){                // 已逃逸
              dirOut=rayTangent(u,du,phi,er,et);escaped=1.0;break;
            }
            if(trans<0.03){dirOut=normalize(seg);escaped=1.0;break;}
            // 步数用尽：b 已判定会逃逸的光线只是还没走完，按当前方向采样星空；
            // 注定被吞掉的则维持黑色。
            if(i==MAX_STEPS-1&&willFall<0.5){dirOut=rayTangent(u,du,phi,er,et);escaped=1.0;}
          }

          // ---- 光子环：n≥1 的像，解析求和 ----
          // b 略大于 b_crit 的光线会绕着黑洞转 n 圈，每半圈穿过一次盘面，
          // 交点在 rho≈r_ph 附近。逐圈积分要上千步（实测 620 步只够绕 0.7 圈，
          // 所以紧贴阴影的那一圈亮环原来是**完全缺失**的，画面上就是盘"断开"）。
          // 这些像沿 b 方向按 e^(-n·π) 几何收敛，直接闭式求和：
          //   Σ_n exp(-n·k·(b-b_crit))  ≈ 1/(1-exp(-k·db))
          // 注意：必须是**逃逸**的光线。被吞掉的光线（b<b_crit）也会贴着盘面螺旋下坠，
          // 上面两个量会跟着变亮，结果把整个阴影填满（试过，黑洞直接消失）。
          if(willFall<0.5){
            float db=max(bImp-2.5981,0.0);
            // 内缘锐（贴着视界，不能糊进阴影），外缘柔（高斯收尾）。
            // 这条软尾巴就是"光被扭曲后的光晕"，而不是一根画上去的细线。
            float inner=smoothstep(2.542,2.606,bImp);
            float outer=exp(-pow(db/0.38,2.0));
            // 关键的一层调制：光线轨道离盘面越远，能捡到的盘光越少。
            // 没有它，环会均匀地围一圈，看起来像个发光甜甜圈；
            // 有了它，水平方向（轨道几乎贴着盘面）最亮，
            // 上下两段被压薄——这才是《星际穿越》那张图的比例。
            float planeClose=mix(0.30,1.0,exp(-pow(yMinAbs/(DISK_H*5.0),2.0)));
            float ringWin=inner*outer*planeClose;
            if(ringWin>0.004){
              // 半径与多普勒全部从**连续量**导出（b 与屏幕方位角），
              // 不再从积分步上取点。上一版用 pNear —— 那是"离赤道最近的
              // 那一步"的坐标，而步长是自适应的：相邻像素落在不同步相位上，
              // rhoP、DP 随之成块跳变，环上就出现马赛克色块。
              // 现在 rhoP(db) 与 DP(屏幕方位) 都是 b、uv 的光滑函数。
              float rhoP=mix(R_IN*1.03,R_OUT*0.90,1.0-exp(-db/0.72));
              // 屏幕 +x 对应盘的迎面侧（与逐点 dot(vh,nobs) 同一约定），
              // 所以 sx 直接就是多普勒的符号项：右侧 D>1，左侧 D<1。
              // 0.82 是"收敛系数"：纯 ±1 会把左半圈直接压没，环就断了。
              float sx=uv.x/max(length(uv),1e-4)*0.82;
              float betaP=min(0.72,sqrt(0.5*RS/max(rhoP,1.15)));
              float DP=1.0/(sqrt(1.0-betaP*betaP)*(1.0-betaP*sx));
              // 距临界越近，堆叠的圈数越多 → 越亮
              float stack=1.0-exp(-6.0*db);
              float w=ringWin*(0.50+0.50*stack);
              float densP;vec3 dcP=diskBandColor(rhoP,DP,densP);
              // n≥1 的像是绕行多圈叠加出来的，湍流的暗纹早被抹平了。
              // 直接沿用单点的 densP 会让环出现"随气流明灭"的断口
              // （实测 180° 附近从 249 掉到 10），所以这里给它一个底、压掉一半起伏。
              densP=mix(0.72,densP,0.42);
              // 暗红余烬下限：多普勒把背向侧压到接近全黑时，环会在左侧
              // "断"成两截。留一层恒定极暗的红，几何上始终闭合，
              // 但亮度只有迎面的 1/8 左右，"右明左暗"的对比仍然成立。
              dcP=max(dcP,vec3(0.360,0.072,0.024));
              // 近侧盘挡在环前面时 trans 会掉到 0.03，环被压没 → 左下方
              // 盘与环的交接处出现一个生硬的"断角"。环是绕行多圈的叠加像，
              // 本来就有一部分光从盘的缝隙里漏出来，所以给它一个透射下限，
              // 让盘缘和环平滑咬合，而不是两条亮带互相切一刀。
              float ringT=mix(trans,1.0,0.55);
              col+=dcP*densP*ringT*w*1.12*uDbg.x;
            }
          }

          // 逃逸的光线带着被弯折过的方向去采样星空 —— 爱因斯坦环就出在这里
          if(escaped>0.5)col+=sky(dirOut)*trans;

          // ACES 近似：高光柔和肩部，不会像线性除法那样把中间调整体抬亮，
          // 也保住"迎面偏蓝、背面偏红"的色相差别
          col*=0.92;
          col=clamp((col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14),0.0,1.0);

          float vd=length((vUv-uCenter)*vec2(uRes.x/max(uRes.y,1.0),1.0));
          col*=1.0-0.52*smoothstep(0.34,1.04,vd);
          gl_FragColor=vec4(max(col,0.0),1.0);
        }`;

      function createBlackHole(){
        bhHost=$('#bh-view');if(!bhHost)return;
        bhRenderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
        // 视口里是柔和的辉光与细星点，1.1 倍像素比足够；再高只是白烧填充率
        bhRatio=Math.min(devicePixelRatio||1,1.1)*bhScale;
        bhRenderer.setPixelRatio(bhRatio);bhRenderer.setClearColor(0x03050a,1);
        bhHost.appendChild(bhRenderer.domElement);
        bhScene=new THREE.Scene();
        bhCamera=new THREE.OrthographicCamera(-1,1,1,-1,-1,1);
        bhMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,toneMapped:false,
          uniforms:{uRes:{value:new THREE.Vector2(1,1)},uTime:{value:0},
            uOrbit:{value:new THREE.Vector2(bhAz,bhEl)},uCenter:{value:new THREE.Vector2(.575,.455)},uDbg:{value:new THREE.Vector2(1,1)},uMouse:{value:new THREE.Vector2(.5,.5)},uMouseK:{value:0}},
          vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
          fragmentShader:BH_FRAG});
        bhQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bhMat);
        // 顶点着色器直接输出裁剪坐标，但 three 仍会在 CPU 侧做剔除，这里关掉
        bhQuad.frustumCulled=false;bhQuad.position.z=-.5;bhScene.add(bhQuad);
        bindBlackHoleInput();bhResize();addEventListener('resize',bhResize);
      }
      function bhResize(){
        if(!bhRenderer||!bhHost)return;
        const w=Math.round(bhHost.clientWidth),h=Math.round(bhHost.clientHeight);
        if(w<2||h<2)return;   // 手机端隐藏时宽高为 0，跳过
        bhRenderer.setPixelRatio(bhRatio);bhRenderer.setSize(w,h,false);
        bhRenderer.domElement.style.width='100%';bhRenderer.domElement.style.height='100%';
        bhMat.uniforms.uRes.value.set(w,h);
      }
      // 拖拽 = 真的在移动相机：横向绕黑洞公转，纵向抬降视角（限位避免看到极点）
      function bindBlackHoleInput(){
        const el=bhHost;
        let hx=0,hy=0;
        el.addEventListener('pointerdown',e=>{bhDown=true;bhPX=e.clientX;bhPY=e.clientY;el.classList.add('dragging');try{el.setPointerCapture(e.pointerId);}catch{}});
        el.addEventListener('pointermove',e=>{
          // 未拖拽时的悬停也会让相机极轻微摆动，说明这是个可以看的立体物
          const r=el.getBoundingClientRect();
          hx=((e.clientX-r.left)/Math.max(1,r.width)*2-1);
          hy=((e.clientY-r.top)/Math.max(1,r.height)*2-1);
          bhHoverX=hx;bhHoverY=hy;
          // 鼠标引力：vUv 的 y 是自下而上，所以要 1 - 比例
          bhMouseU=(e.clientX-r.left)/Math.max(1,r.width);
          bhMouseV=1-(e.clientY-r.top)/Math.max(1,r.height);
          // 拖拽时把引力降到 0.35：两个交互都保留，但公转读得清
          bhMouseKT=bhDown?0.35:1;
          if(!running)bhSchedule();
          if(!bhDown)return;
          bhAzT=THREE.MathUtils.clamp(bhAzT+(e.clientX-bhPX)*.0042,-1.9,1.9);
          bhElT=THREE.MathUtils.clamp(bhElT-(e.clientY-bhPY)*.0022,-.20,.34);
          bhPX=e.clientX;bhPY=e.clientY;
        });
        el.addEventListener('pointerleave',()=>{bhHoverX=0;bhHoverY=0;bhMouseKT=0;bhSchedule();});
        const end=e=>{if(!bhDown)return;bhDown=false;el.classList.remove('dragging');bhMouseKT=1;if(!running)bhSchedule();try{el.releasePointerCapture(e.pointerId);}catch{}};
        el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
      }
      function bhSchedule(){if(!bhPending){bhPending=true;requestAnimationFrame(bhFrame);}}
      function bhFrame(now){
        bhPending=false;
        if(current===null||!bhRenderer||document.hidden)return;   // 只在黑洞分类页渲染
        if(bhHost.clientWidth<2||bhHost.clientHeight<2)return;    // 手机端视口隐藏，直接不跑
        const dt=Math.min(.05,(now-bhLast||16)/1000);bhLast=now;bhTime+=dt;
        const k=Math.min(1,dt*5.0);
        bhAz+=(bhAzT-bhAz)*k;bhEl+=(bhElT-bhEl)*k;
        bhHoverK+=(1-bhHoverK)*Math.min(1,dt*2.2);
        const u=bhMat.uniforms;
        u.uTime.value=bhTime;
        u.uOrbit.value.set(bhAz+bhHoverX*.05*bhHoverK,THREE.MathUtils.clamp(bhEl-bhHoverY*.045*bhHoverK,-.22,.36));
        // 鼠标引力强度做缓动：进出视口时不跳变
        bhMouseK+=(bhMouseKT-bhMouseK)*Math.min(1,dt*5.5);
        if(bhMouseK<0.002)bhMouseK=0;
        u.uMouseK.value=bhMouseK;
        u.uMouse.value.set(bhMouseU,bhMouseV);
        bhRenderer.render(bhScene,bhCamera);
        bhFrames++;
        // 自适应分辨率：用"丢帧数"驱动，而不是平均帧间隔。
        // 帧间隔被 vsync 压在 16.7ms，永远看不出还有多少余量，
        // 只看平均值的话它只会一路往下掉、再也升不回来。
        // dt>25ms 才算丢了一帧（2 帧 = 33ms）；>60ms 的是切标签/截图，忽略。
        if(bhWarm<120)bhWarm++;
        else if(dt<0.06){
          bhSampleN++;
          if(dt>0.025)bhMissed++;
          if(bhSampleN>=90){
            let next=bhScale;
            if(bhMissed>7){
              next=Math.max(0.66,bhScale-0.07);
              bhClean=0;                      // 刚掉过帧，重新攒"干净窗口"
            }else if(bhMissed===0){
              // 升档要更保守：必须连续多个窗口一帧不丢才敢升，
              // 否则会在 0.78↔0.90 之间来回跳，肉眼能看到清晰度在抖。
              if(++bhClean>=6)next=Math.min(0.95,bhScale+0.04);
            }else bhClean=0;
            bhSampleN=0;bhMissed=0;
            if(next!==bhScale){bhScale=next;bhRatio=Math.min(devicePixelRatio||1,1.1)*bhScale;bhResize();}
          }
        }
        bhSchedule();
      }
      // ============ 星际尘埃带 ============
      // 螺旋臂**之间**那一层暗褐粒子。它不是发光体，作用是"吸收"：
      // 用 NormalBlending 的暗色粒子覆盖在已经画好的加法混合光之上，
      // 把背后的星光压暗 —— 真实星系照片里那种沟壑纵横的立体感就是这么来的。
      // 单靠加法混合永远做不出遮挡，所以这一层必须是独立绘制、独立混合模式。
      function buildDustLanes(){
        const pos=new Float32Array(DUST_COUNT*3),col=new Float32Array(DUST_COUNT*3);
        const sz=new Float32Array(DUST_COUNT),al=new Float32Array(DUST_COUNT),sec=new Float32Array(DUST_COUNT);
        const random=seeded(77331),sw=new THREE.Color();
        for(let i=0;i<DUST_COUNT;i++){
          const o=i*3;
          // 半径分布略偏外盘：尘埃在核球里会被烤掉，真实的尘埃带都在中外部
          // 起点 1.30 世界（约 82px）：核球内不铺尘埃。
          // 真实星系的核心区尘埃确实少（被辐射清空），而且这样不会把白核压灰。
          const radius=1.30+Math.pow(random(),.85)*3.95;
          // ---- 关键：落在臂**之间** ----
          // 粒子旋臂是 arm*72°+r*1.24；尘埃整体偏半个臂距（36°），
          // 并且随半径缓慢漂移（-r*0.22），于是它沿着臂的内侧蜿蜒，
          // 而不是一圈同心环。
          const arm=i%5;
          // 抖动从 ±0.30 收到 ±0.15：收到这个量级，尘埃才成"条带"，
          // 再宽就摊成一层均匀的褐雾（实测压暗了 31% 但只有 1.7% 区域成沟壑）。
          const angle=arm*1.25664+radius*1.24+Math.PI/5-radius*.22+(random()-.5)*.15;
          const thick=.18*Math.exp(-radius*.5)+.035+radius*.016;
          pos[o]=Math.cos(angle)*radius;
          pos[o+1]=Math.sin(angle)*radius;
          pos[o+2]=(random()+random()-1)*thick;
          // 暗红 / 深褐：R 最高、G 次之、B 极低。再往蓝里偏一点就成了灰雾。
          // 吸收式混合下，color 实际上被忽略（只用到 alpha），但保留暖色便于以后
          // 换成 NormalBlending 做对比；这里写的是深褐。
          const warm=.55+random()*.45;
          sw.setRGB(0.150*warm+0.035,0.062*warm+0.016,0.034*warm+0.010);
          col[o]=sw.r;col[o+1]=sw.g;col[o+2]=sw.b;
          // 尺寸比发光粒子稍大（尘埃是团絮，不是点），但透明度极低
          // 尘埃是团絮不是点：.055-.195 世界单位，投影约 3.6-13px。
          // 上一版 .026-.078（1.7-5px）太碎，叠不成"带"，看不出遮挡。
          sz[i]=.060+Math.pow(random(),1.5)*.150;
          al[i]=.24+Math.pow(random(),1.2)*.34;
          sec[i]=((angle/6.2831853)%1+1)%1;
        }

        if(running||morphTween||camDistTween)schedule();

        renderer.setRenderTarget(null);renderer.render(scene,camera);schedule();}
      function enableInspector(){if(!new URLSearchParams(location.search).has('inspect'))return;Object.defineProperty(window,'spaceNav',{value:Object.freeze({getState:()=>({particleCount:geometry.attributes.position.count,pointsObjects:scene.children.filter(o=>o.isPoints).length,skyParallax:SKY_PAR,drawCalls:renderer.info.render.calls,cameraZ:Number(camera.position.z.toFixed(3)),cameraY:Number(camera.position.y.toFixed(2)),cameraDist:Number(camDist.toFixed(2)),zoom:Number(zoom.toFixed(4)),zoomTarget:Number(zoomTarget.toFixed(4)),zoomRange:[Number(zoomMin.toFixed(4)),Number(zoomMax.toFixed(4))],orbitDist:Number(THREE.MathUtils.clamp(camDist*fitPull*zoom,MIN_DIST,MAX_DIST).toFixed(3)),distLimits:[Number(MIN_DIST.toFixed(2)),Number(MAX_DIST.toFixed(2))],zLimits:[Z_MIN,Z_MAX],cameraElevationDeg:Number((Math.atan2(camera.position.y,camera.position.z)*180/Math.PI).toFixed(1)),galaxyTiltX:Number(gTilt.toFixed(3)),spinZ:Number(spinning.toFixed(5)),spinRate:Number((SPIN_BASE+hoverS*SPIN_HOVER).toFixed(5)),hoverStrength:Number(hoverS.toFixed(3)),hoverAngle:Number(hoverAngle.toFixed(4)),parallaxX:Number(parX.toFixed(3)),parallaxY:Number(parY.toFixed(3)),skyShift:[Number(points.material.uniforms.uSkyShift.value.x.toFixed(3)),Number(points.material.uniforms.uSkyShift.value.y.toFixed(3))],skyCount:SKY_COUNT,tinyCount:TINY_COUNT,bigCount:BIG_COUNT,galaxyCount:GALAXY_COUNT,

          drawCallsHome:renderer.info.render.calls,

          coreHot:CORE_HOT,

        // 右侧黑洞视口探针：帧数、绘制调用、尺寸、拖拽状态
        blackHole:()=>({active:current!==null,frames:bhFrames,drawCalls:bhRenderer?bhRenderer.info.render.calls:0,

        projection:()=>{const v=new THREE.Vector3();let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;const ring=[{n:0,r:0,g:0,b:0},{n:0,r:0,g:0,b:0},{n:0,r:0,g:0,b:0}];const sizeRing=[{n:0,v:0},{n:0,v:0},{n:0,v:0}];
          for(let i=SKY_COUNT;i<TOTAL_COUNT;i++){v.fromBufferAttribute(geometry.attributes.position,i);const radius=Math.hypot(v.x,v.y);v.applyMatrix3(galaxyMat).project(camera);if(v.x<x0)x0=v.x;if(v.x>x1)x1=v.x;if(v.y<y0)y0=v.y;if(v.y>y1)y1=v.y;
            const band=radius<1.6?0:radius<3.4?1:2;ring[band].n++;ring[band].r+=colors[i*3];ring[band].g+=colors[i*3+1];ring[band].b+=colors[i*3+2];sizeRing[band].n++;sizeRing[band].v+=sizes[i];}

        parallaxState:()=>{

            near:[+offNear.x.toFixed(2),+offNear.y.toFixed(2)],
            sky:[+sky.x.toFixed(2),+sky.y.toFixed(2)],

        // 背景层探针：统计真正落进画面的星尘数量与平均亮度，确认"看起来不空"
        skyProjection:()=>{const v=new THREE.Vector3();let onScreen=0,litPixels=0,sumAlpha=0;
