name: Collect AI Tools

# 每天凌晨自动采集一次,也可手动触发
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 允许 workflow 提交回仓库

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run collector
        env:
          # 复用 Actions 自动注入的 token,无需额外配置 secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PER_SOURCE: "25"
        run: python scripts/collect_tools.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tools.json
          git commit -m "chore(tools): update collected tools [skip ci]" || echo "nothing to commit"
          git push
